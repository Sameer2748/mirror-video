# Build the face-map GPU worker and push it to Docker Hub.
# Separate from the CPU pipeline image: insightface/ultralytics break mediapipe.
name: worker face-gpu image

on:
  push:
    paths:
      - app/worker/Dockerfile.gpu
      - app/worker/fetch_face_inputs.py
      - app/worker/handler.py
      - pipeline_tools/facemap.py
      - .github/workflows/worker-face-gpu.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker Hub tag to push"
        default: face-gpu
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Face-map build inputs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
        run: |
          pip install --quiet httpx
          python3 app/worker/fetch_face_inputs.py
          ls -lh app/worker

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app/worker
          file: app/worker/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dubstudio-worker:${{ inputs.tag || 'face-gpu' }}
          cache-from: type=gha,scope=face-gpu
          cache-to: type=gha,mode=max,scope=face-gpu,ignore-error=true

      - name: What went in
        run: docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/dubstudio-worker:${{ inputs.tag || 'face-gpu' }}
