# Build the pipeline worker image and push it to Docker Hub (docs/09 §8).
#
# Why here and not on the Mac: the image is about 6 GB, and building it locally needs ~15 GB of free disk. The
# Mac's disk hit 98% full mid-build, which aborted the Docker VM's ext4 journal and corrupted its content store.
# A CI runner has the space, and building here also makes the image reproducible instead of "whatever was on the
# laptop that day".
#
# The pipeline scripts, TalkNet and the Whisper / sentence models are NOT in this repo -- it is public, and they are
# the owner's pipeline. They are staged in R2 and fetched here with the bucket's own keys, held as repository
# secrets. Nothing secret ends up inside the image.
name: worker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker Hub tag to push"
        default: pipeline
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make room (the image is ~6 GB)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Put the build inputs where the Dockerfile expects them
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ secrets.R2_PREFIX }}
        run: |
          pip install --quiet httpx
          python3 app/worker/fetch_inputs.py
          ls -lh app/worker

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app/worker
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dubstudio-worker:${{ inputs.tag || 'pipeline' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: What went in
        run: docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/dubstudio-worker:${{ inputs.tag || 'pipeline' }}
